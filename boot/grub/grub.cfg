# ============================================================
# BotOS Core — GRUB Bootloader Configuration
# ============================================================
# Custom GRUB config with BotOS branding and serial console.
# This file is installed to /boot/grub/grub.cfg in the image.
# ============================================================

set default=0
set timeout=5

# ── Serial Console ─────────────────────────────────────────
serial --speed=115200 --unit=0 --word=8 --parity=no --stop=1
terminal_input serial console
terminal_output serial console

# ── Theme & Branding ──────────────────────────────────────
set menu_color_normal=light-gray/black
set menu_color_highlight=white/dark-gray

# ── Boot Entries ───────────────────────────────────────────

menuentry "BotOS Core v0.3.0" {
    linux /boot/bzImage root=/dev/sda rw console=ttyS0,115200 loglevel=7 quiet
}

menuentry "BotOS Core v0.3.0 (Verbose)" {
    linux /boot/bzImage root=/dev/sda rw console=ttyS0,115200 loglevel=8
}

menuentry "BotOS Core v0.3.0 (Recovery)" {
    linux /boot/bzImage root=/dev/sda rw console=ttyS0,115200 loglevel=7 single init=/bin/bash
}
