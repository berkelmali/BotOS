# ============================================================
# BotOS Core — System Configuration
# ============================================================
# Central configuration file for BotOS services.
# Loaded by /etc/init.d/S99botos during boot.
# ============================================================

# ── System ─────────────────────────────────────────────────
BOTOS_VERSION="0.3.0"
BOTOS_HOSTNAME="botos"

# ── BotShell ───────────────────────────────────────────────
# Default shell prompt format
BOTSHELL_PROMPT="botshell"
# Enable PyBridge (Python bridge) by default
BOTSHELL_PYBRIDGE_ENABLED=1
# History file location
BOTSHELL_HISTORY_FILE="/home/.botshell_history"
# Maximum history entries
BOTSHELL_HISTORY_SIZE=1000

# ── BotLog ─────────────────────────────────────────────────
# Log output directory
BOTLOG_DIR="/var/log/botos"
# Minimum log level: DEBUG, INFO, WARN, ERROR, FATAL
BOTLOG_LEVEL="INFO"
# Maximum log file size before rotation (bytes)
BOTLOG_MAX_SIZE=10485760
# Number of rotated log files to keep
BOTLOG_ROTATE_COUNT=5

# ── BotNet ─────────────────────────────────────────────────
# Package repository URL
BOTNET_REPO_URL="https://repo.botos.dev/packages"
# Connection timeout (seconds)
BOTNET_TIMEOUT=30
# Enable TLS verification
BOTNET_TLS_VERIFY=1

# ── BotPkg ─────────────────────────────────────────────────
# Package cache directory
BOTPKG_CACHE_DIR="/var/cache/botpkg"
# Installed package database
BOTPKG_DB_DIR="/var/lib/botpkg"
# Auto-resolve dependencies
BOTPKG_AUTO_DEPS=1

# ── VFS ────────────────────────────────────────────────────
# Default filesystem driver
VFS_DEFAULT_DRIVER="ext4"
# Enable network filesystem support
VFS_NETFS_ENABLED=1
# Mount table path
VFS_MOUNT_TABLE="/etc/botos/mounts"
